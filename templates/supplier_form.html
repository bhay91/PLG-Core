{% extends "base.html" %}{% block title %}{{ title }} · Pinpoint Sourcing LLC{% endblock %}{% block content %}
<section class="workspace-heading"><div><p class="eyebrow">SUPPLIER MANAGEMENT</p><h1>{{ title }}</h1><p>{{ subtitle }}</p></div><a class="button ghost" href="/suppliers">Cancel</a></section>
<form method="post" action="{{ form_action }}" class="panel form-grid"><div class="form-section"><label>Supplier Name *<input name="name" value="{{ supplier.name or '' }}" required></label><label>Website<input name="website" type="url" value="{{ supplier.website or '' }}"></label><div class="two-column"><label>Phone<input name="phone" value="{{ supplier.phone or '' }}"></label><label>Email<input name="email" type="email" value="{{ supplier.email or '' }}"></label></div><div class="two-column"><label>Contact Person<input name="contact_person" value="{{ supplier.contact_person or '' }}"></label><label>Account Number<input name="account_number" value="{{ supplier.account_number or '' }}"></label></div><div class="two-column"><label>Status<select name="status"><option value="ACTIVE" {% if supplier.status=='ACTIVE' %}selected{% endif %}>Active</option><option value="INACTIVE" {% if supplier.status=='INACTIVE' %}selected{% endif %}>Inactive</option><option value="DO_NOT_USE" {% if supplier.status=='DO_NOT_USE' %}selected{% endif %}>Do Not Use</option></select></label><label>Rating<select name="rating">{% for n in range(1,6) %}<option value="{{ n }}" {% if supplier.rating==n %}selected{% endif %}>{{ n }}</option>{% endfor %}</select></label></div><label class="checkbox-label"><input name="preferred" type="checkbox" value="1" {% if supplier.preferred %}checked{% endif %}>Preferred Supplier</label></div><div class="form-actions full"><a class="button ghost" href="/suppliers">Cancel</a><button type="submit" class="button">{{ submit_label }}</button></div></form>{% endblock %}
