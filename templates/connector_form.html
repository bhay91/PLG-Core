{% extends "base.html" %}{% block title %}{{ title }} · Pinpoint Sourcing Co.{% endblock %}{% block content %}
<section class="workspace-heading"><div><p class="eyebrow">CONNECTOR MANAGEMENT</p><h1>{{ title }}</h1><p>{{ subtitle }}</p></div><a class="button ghost" href="/connectors">Cancel</a></section>
<form method="post" action="{{ form_action }}" class="panel form-grid"><div class="form-section"><label>Name *<input name="display_name" value="{{ connector.display_name or '' }}" required></label><label>Launch URL<input name="launch_url" type="url" value="{{ connector.launch_url or '' }}"></label><div class="two-column"><label>Category<input name="category" value="{{ connector.category or 'Supplier' }}"></label><label>Connector Type<select name="connector_type"><option value="CART" {% if connector.connector_type=='CART' %}selected{% endif %}>Cart</option><option value="CATALOG" {% if connector.connector_type=='CATALOG' %}selected{% endif %}>Catalog</option><option value="UPLOAD" {% if connector.connector_type=='UPLOAD' %}selected{% endif %}>Upload</option></select></label></div><label>Trust Level<select name="trust_level"><option value="OEM_VERIFIED" {% if connector.trust_level=='OEM_VERIFIED' %}selected{% endif %}>OEM Verified</option><option value="SUPPLIER_VERIFIED" {% if connector.trust_level=='SUPPLIER_VERIFIED' %}selected{% endif %}>Supplier Verified</option><option value="NEEDS_REVIEW" {% if connector.trust_level=='NEEDS_REVIEW' %}selected{% endif %}>Needs Review</option></select></label></div><div class="form-actions full"><a class="button ghost" href="/connectors">Cancel</a><button class="button">{{ submit_label }}</button></div></form>{% endblock %}
