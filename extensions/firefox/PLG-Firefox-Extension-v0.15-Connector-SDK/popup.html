<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLG Verify Assistant</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>PLG Verify Assistant</h1>

  <section class="card">
    <strong id="detectedSite">Detecting source…</strong>
    <span id="jobNumber"></span>
    <span id="customer"></span>
    <span id="machine"></span>
    <span id="pin"></span>
  </section>

  <button id="refresh">Refresh Active Job</button>
  <button id="read">Read Current Cart</button>

  <section class="card results">
    <strong id="count">No cart read yet</strong>
    <div id="items"></div>

    <div class="totals">
      <div><span>Parts Subtotal</span><strong id="subtotal">—</strong></div>
      <div><span>Shipping</span><strong id="shipping">—</strong></div>
      <div><span>Supplier Total</span><strong id="supplierTotal">—</strong></div>
    </div>
  </section>

  <button id="import" class="primary">Import Cart Items</button>
  <div id="status"></div>
</main>
<script src="popup.js"></script>
</body>
</html>
