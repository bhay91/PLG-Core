<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PartsLink Global{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body>
  <aside class="sidebar">
    <a href="/" class="brand">
      <span class="brand-mark">PLG</span>
      <span>
        <strong>PartsLink Global</strong>
        <small>Worldwide Parts Sourcing & Logistics</small>
      </span>
    </a>

    <nav>
      <a class="{% if active_page == 'dashboard' %}active{% endif %}" href="/">Dashboard</a>
      <a class="{% if active_page == 'jobs' %}active{% endif %}" href="/jobs">Jobs</a>
      <span class="disabled">Customers</span>
      <span class="disabled">Verified Parts</span>
      <span class="disabled">Suppliers</span>
      <span class="disabled">Quotes</span>
      <span class="disabled">Invoices</span>
    </nav>

    <div class="sidebar-footer">
      <a class="button" href="/jobs/new">+ New Job</a>
      <small>PLG Core v0.11</small>
    </div>
  </aside>

  <main class="main-shell">
    <header class="topbar">
      <div>
        <strong>Parts sourcing control center</strong>
        <small>OEM verification · supplier sourcing · job management</small>
      </div>
      <a class="button small" href="/jobs/new">New Job</a>
    </header>

    <section class="page">
      {% block content %}{% endblock %}
    </section>
  </main>
</body>
</html>
