<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLG Verify Assistant</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>PLG Verify Assistant</h1>
  <p class="sub" id="modeLabel">CAT SIS</p>

  <section class="card">
    <strong id="jobNumber">Loading…</strong>
    <span id="customer"></span>
    <span id="machine"></span>
    <span id="pin"></span>
    <span id="requestedPart"></span>
  </section>

  <section id="singleMode">
    <section class="capture-card">
      <p class="label">Detected from CAT SIS</p>
      <strong id="partNumber">Open the correct SIS part</strong>
      <span id="description"></span>
      <span id="price"></span>
      <span id="availability"></span>
    </section>
    <button id="readPart">Read Current SIS Part</button>
    <button id="importPart" class="primary">Import Verified Part</button>
  </section>

  <section id="cartMode" hidden>
    <section class="capture-card">
      <p class="label">SIS CART</p>
      <strong id="cartCount">Read the visible cart</strong>
      <div id="cartItems" class="cart-items"></div>
    </section>
    <button id="readCart">Read SIS Cart</button>
    <button id="importCart" class="primary">Import All Cart Items</button>
  </section>

  <div id="status" role="status" aria-live="polite"></div>
</main>
<script src="popup.js"></script>
</body>
</html>
