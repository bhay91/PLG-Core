<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLG CAT Assistant</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<h1>PLG CAT Assistant</h1><p class="sub">Import from CAT</p>
<section class="card"><strong id="jobNumber">Loading…</strong><span id="customer"></span><span id="machine"></span><span id="pin"></span><span id="requestedPart"></span></section>
<button id="refreshJob" class="secondary">Refresh active job</button>
<button id="loadMachine" class="primary">Load machine PIN</button>
<section class="capture-card">
<p class="label">Detected CAT information</p>
<strong id="currentPart">Open a CAT product page</strong>
<span id="currentDescription"></span><span id="dealerName"></span><span id="dealerPrice"></span><span id="availability"></span><span id="leadTime"></span>
<small id="diagramStatus">No diagram URL recorded yet.</small>
</section>
<button id="inspectCurrent">Read Current CAT Product</button>
<button id="captureCurrent" class="primary">Import from CAT</button>
<div id="status" role="status" aria-live="polite"></div>
<p class="note">Review the detected dealer and price before importing.</p>
</main><script src="popup.js"></script></body></html>
