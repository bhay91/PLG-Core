<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PLG CAT Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>PLG CAT Assistant</h1>
    <p class="sub">Connected to PLG Core</p>

    <section id="jobCard" class="card">
      <strong id="jobNumber">No active verification</strong>
      <span id="customer"></span>
      <span id="machine"></span>
      <span id="pin"></span>
      <span id="requestedPart"></span>
    </section>

    <button id="refreshJob" class="secondary">Refresh active job</button>
    <button id="loadMachine" class="primary">Load machine PIN</button>

    <hr>

    <label for="oemPartNumber">OEM part number</label>
    <input id="oemPartNumber" autocomplete="off" placeholder="221-3133">

    <label for="oemDescription">OEM description</label>
    <input id="oemDescription" autocomplete="off" placeholder="Cable Assembly (Governor Control)">

    <div class="row">
      <label>Diagram / group
        <input id="diagramName" autocomplete="off">
      </label>
      <label>Callout
        <input id="calloutNumber" autocomplete="off">
      </label>
    </div>

    <label for="verificationNotes">Verification notes</label>
    <textarea id="verificationNotes" rows="3"></textarea>

    <button id="capturePart">Capture to PLG Job</button>

    <div id="status" role="status" aria-live="polite"></div>

    <p class="note">
      Navigate the CAT diagram, select the correct part, then enter or paste the OEM number and description before capturing.
    </p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
