<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PLG CAT Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>PLG CAT Assistant</h1>
    <p class="sub">OEM terminology-assisted CAT Parts search</p>

    <label for="pin">Machine PIN / Serial</label>
    <input id="pin" type="text" value="FDP15598" autocomplete="off">
    <button id="addEquipment" class="primary">Add equipment</button>

    <label for="customerTerm">Customer / mechanic term</label>
    <input id="customerTerm" type="text" value="accelerator cable" autocomplete="off">

    <button id="buildTerms">Build OEM search terms</button>

    <label for="termSelect">OEM search term</label>
    <select id="termSelect"></select>

    <div class="row">
      <button id="searchSelected">Search selected term</button>
      <button id="searchNext" class="secondary">Search next term</button>
    </div>

    <button id="copySummary" class="secondary">Copy PLG lookup summary</button>

    <div id="status" role="status" aria-live="polite"></div>

    <p class="note">
      This is human-assisted. Review CAT's results and select the correct configuration before ordering.
    </p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
